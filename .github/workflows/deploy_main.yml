name: Deploy Swipies Main App

on:
  push:
    branches: [swipies_26]
    paths-ignore:
      - 'atmos payment system/**'
      - 'landing_swipies/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  deploy-main:
    if: github.ref == 'refs/heads/swipies_26'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact commit with private backup and rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 45m
          script: |
            bash -seuo pipefail <<'DEPLOY'
            cd "$HOME/swipies__ai_"
            git fetch origin swipies_26
            test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA" || { echo 'A newer release is queued; refusing stale deployment'; exit 1; }
            git show "$DEPLOY_SHA:docker/deploy_main.sh" | bash -s -- "$DEPLOY_SHA"
            DEPLOY
      - name: Verify public Agent Access endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://api.swipies.app/api/v1/agent-access/manifest', timeout=30) as response:
              manifest = json.load(response)
          assert manifest['name'] == 'Swipies Agent Access'
          assert manifest['branding']['removal_plans'] == ['plus', 'pro']
          print('Public Agent Access manifest verified')
          PY
