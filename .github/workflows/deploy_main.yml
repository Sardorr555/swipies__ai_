# Force trigger deployment
name: Deploy Ragflow

on:
  push:
    branches:
      - swipies_26
    paths:
      - '**'
      - '!swipies__ai_/landing/**'
      - '!swipies__ai_/appsmith/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          command_timeout: 45m
          script: |
            set -e
            cd ~/swipies__ai_

            echo "📥 Обновляем код..."
            git fetch origin swipies_26
            git reset --hard origin/swipies_26

            cd docker

            echo "🛑 Полностью останавливаем и удаляем все старые контейнеры..."
            docker compose down --remove-orphans || true
            docker ps -a -q | xargs -r docker rm -f || true
            docker network prune -f || true

            echo "🐳 Собираем новые образы (с кэшированием для скорости)..."
            docker compose build

            echo "🚀 Запускаем..."
            docker compose up -d --remove-orphans

            echo "🧹 Чистим старые образы..."
            docker image prune -f

            echo "✅ Ragflow обновлён!"