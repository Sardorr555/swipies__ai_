name: Deploy Ragflow

on:
  push:
    branches:
      - swipies_25
    paths:
      - '**'
      - '!swipies__ai_/landing/**'
      - '!swipies__ai_/appsmith/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/swipies__ai_

            echo "📥 Обновляем код для ветки swipies_25..."
            git fetch origin swipies_25
            git reset --hard origin/swipies_25
  
            cd docker

            echo "🐳 Собираем контейнеры (с кэшем для экономии ресурсов EC2)..."
            # Собираем новые образы параллельно, пока старые контейнеры продолжают обслуживать пользователей
            docker compose build

            echo "🚀 Перезапускаем только изменившиеся сервисы (без простоя/downtime)..."
            # docker compose up -d автоматически обновит только изменившиеся контейнеры за секунду.
            # Мы НЕ используем 'docker compose down', чтобы база данных и другие службы работали без сбоев.
            docker compose up -d

            echo "🧹 Очищаем старый кэш и неиспользуемые образы..."
            docker image prune -f

            echo "✅ Ragflow успешно обновлён и доступен!"
