# Force trigger deployment
name: Deploy Ragflow

on:
  push:
    branches:
      - licence_v
    paths:
      - '**'
      - '!swipies__ai_/landing/**'
      - '!swipies__ai_/appsmith/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pynacl requests

      - name: Replicate Secrets to Swipies_docs
        env:
          EC2_HOST: "100.31.87.176"
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          python copy_secrets.py

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "100.31.87.176"
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          command_timeout: 45m
          script: |
            set -e
            if [ ! -d ~/swipies__ai_ ]; then
              echo "🚀 Директория ~/swipies__ai_ не найдена. Клонируем репозиторий..."
              git clone -b licence_v https://github.com/Sardorr555/swipies__ai_.git ~/swipies__ai_ || git clone -b licence_v git@github.com:Sardorr555/swipies__ai_.git ~/swipies__ai_
            fi
            cd ~/swipies__ai_

            echo "📥 Обновляем код..."
            git fetch origin licence_v
            git reset --hard origin/licence_v

            cd docker

            if ! grep -q "dh-mirror.gitverse.ru" /etc/docker/daemon.json 2>/dev/null; then
              echo "⚙️ Настраиваем зеркало Docker Hub для обхода блокировок и 502 Bad Gateway..."
              sudo mkdir -p /etc/docker
              echo '{"registry-mirrors": ["https://dh-mirror.gitverse.ru", "https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
              echo "🔄 Перезапускаем Docker..."
              sudo systemctl daemon-reload
              sudo systemctl restart docker || sudo service docker restart || true
            fi

            echo "🛑 Полностью останавливаем и удаляем старые бэкенд контейнеры..."
            docker compose down --remove-orphans || true
            docker rm -f swipies-minio swipies-mysql swipies-redis swipies-es01 swipies-frontend swipies-cpu swipies-gpu swipies-infinity swipies-seekdb || true

            echo "🐳 Собираем новые образы (с кэшированием для скорости)..."
            docker compose build

            echo "🚀 Запускаем..."
            docker compose up -d --remove-orphans

            echo "⏳ Ждем запуска сервисов..."
            sleep 15

            echo "📊 Статус контейнеров:"
            docker compose ps

            echo "🔑 Предоставляем права superuser всем зарегистрированным пользователям..."
            docker exec -i swipies-mysql mysql -uroot -p0czavZsPcYfroExMAdb -D rag_flow -e "UPDATE user SET is_superuser = 1;" || true
            docker exec -i swipies-mysql mysql -uroot -p0czavZsPcYfroExMAdb -D rag_flow -e "SELECT email, is_superuser FROM user;" || true

            echo "📝 Логи сервисов:"
            docker compose logs --tail=100

            echo "🧹 Чистим старые образы..."
            docker image prune -f

            echo "✅ Ragflow обновлён!"