name: Deploy Swipies Main App

on:
  push:
    branches:
      - swipies_26
    paths-ignore:
      - 'atmos payment system/**'
      - 'landing_swipies/**'
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pynacl requests || true

      - name: Replicate Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          python copy_secrets.py || true

      - name: Deploy Main Application to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          command_timeout: 45m
          script: |
            set -e
            echo "=========================================="
            echo "🚀 DEPLOYING SWIPIES MAIN APP"
            echo "=========================================="

            # 1. Arm deployment lock & pause watchdog while deployment is in progress
            echo "🔒 Arming deployment lock..."
            sudo touch /tmp/swipies_deploying.lock
            trap 'sudo rm -f /tmp/swipies_deploying.lock 2>/dev/null || true' EXIT

            echo "🛑 Temporarily disabling watchdog to prevent container startup races..."
            sudo rm -f /etc/cron.d/swipies-stack-watchdog 2>/dev/null || true
            sudo systemctl stop swipies-stack.service 2>/dev/null || true
            if [ -f /tmp/swipies_watchdog.pid ]; then
              sudo kill -9 "$(cat /tmp/swipies_watchdog.pid)" 2>/dev/null || true
              sudo rm -f /tmp/swipies_watchdog.pid 2>/dev/null || true
            fi

            cd ~/swipies__ai_

            echo "📥 Updating main repository..."
            sudo chown -R ubuntu:ubuntu ~/swipies__ai_
            git fetch origin swipies_26
            git reset --hard origin/swipies_26

            echo "📥 Syncing submodules..."
            git submodule sync --recursive
            git submodule update --init --recursive --force

            cd ~/swipies__ai_/"atmos payment system"
            git checkout main || true
            git pull origin main || true

            echo "💳 Ensuring Atmos Payment System is armed and running immediately..."
            bash ~/swipies__ai_/docker/ensure_payment_service.sh || true

            cd ~/swipies__ai_/docker

            if ! grep -q "dh-mirror.gitverse.ru" /etc/docker/daemon.json 2>/dev/null; then
              echo "⚙️ Configuring Docker Hub mirror..."
              sudo mkdir -p /etc/docker
              echo '{"registry-mirrors": ["https://dh-mirror.gitverse.ru", "https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
              sudo systemctl daemon-reload
              sudo systemctl restart docker || sudo service docker restart || true
            fi

            echo "🧹 Pruning Docker BuildKit cache..."
            sudo docker builder prune -a -f || true

            echo "🐳 Building new Docker images..."
            sudo docker compose -f docker-compose.yml --profile cpu --profile elasticsearch build

            set +e
            echo "🛑 Ensuring clean state before stack start..."
            if [ -f /tmp/swipies_watchdog.pid ]; then
              sudo kill -9 "$(cat /tmp/swipies_watchdog.pid)" 2>/dev/null || true
              sudo rm -f /tmp/swipies_watchdog.pid 2>/dev/null || true
            fi

            # Take down compose cleanly
            sudo docker compose -f docker-compose.yml --profile "*" down --remove-orphans -t 5 2>/dev/null || true

            # Force stop & remove all possible swipies containers
            for name in swipies-minio swipies-redis swipies-mysql swipies-es01 swipies-docs swipies-frontend swipies-cpu swipies-deepdoc swipies-oceanbase swipies-seekdb swipies-sandbox-executor-manager swipies-opensearch01 swipies-infinity; do
              sudo docker stop "$name" 2>/dev/null || true
              sudo docker rm -f -v "$name" 2>/dev/null || true
            done
            for c in $(sudo docker ps -a -q --filter "name=swipies-"); do sudo docker rm -f -v "$c" 2>/dev/null || true; done
            for c in $(sudo docker ps -a -q); do sudo docker rm -f -v "$c" 2>/dev/null || true; done
            sudo docker container prune -f 2>/dev/null || true
            sudo docker network rm docker_ragflow 2>/dev/null || true
            sudo docker network prune -f 2>/dev/null || true
            sleep 3
            set -e

            echo "🚀 Starting Docker stack..."
            sudo docker compose -f docker-compose.yml --profile cpu --profile elasticsearch up -d --remove-orphans --force-recreate

            echo "⏳ Waiting for RAGFlow Python API server to be ready..."
            API_READY=false
            for i in {1..40}; do
              if sudo docker exec swipies-cpu curl -s -f http://127.0.0.1:9380/api/v1/system/version >/dev/null 2>&1 || sudo docker exec swipies-cpu curl -s -f http://127.0.0.1:9380/v1/system/version >/dev/null 2>&1; then
                echo "✅ RAGFlow Python API server is UP and responding!"
                API_READY=true
                break
              fi
              echo "Waiting for Python API server (attempt $i/40)..."
              sleep 3
            done

            if [ "$API_READY" != "true" ]; then
              echo "⚠️ swipies-cpu API check did not succeed within timeout. Inspecting logs:"
              sudo docker logs --tail 200 swipies-cpu || true
            fi

            echo "📊 Docker Container Status:"
            sudo docker compose ps

            echo "🛡️ Ensuring stack auto-restart across reboots..."
            bash ~/swipies__ai_/docker/ensure_stack_autostart.sh || true

            echo "💳 Ensuring Atmos Payment System is running..."
            bash ~/swipies__ai_/docker/ensure_payment_service.sh || true

            echo "🧹 Cleaning up old unused images..."
            sudo docker image prune -f || true

            # Release deployment lock
            sudo rm -f /tmp/swipies_deploying.lock 2>/dev/null || true

            echo "✅ Main application and Payment System deployment completed successfully!"