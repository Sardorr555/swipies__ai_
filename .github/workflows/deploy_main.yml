# Force trigger deployment
name: Deploy Ragflow

on:
  push:
    branches:
      - licence_v
    paths:
      - '**'
      - '!swipies__ai_/landing/**'
      - '!swipies__ai_/appsmith/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          command_timeout: 45m
          script: |
            set -e
            cd ~/swipies__ai_/docker

            echo "📊 Статус контейнеров:"
            docker compose ps

            echo "📝 Логи сервисов:"
            docker compose logs --tail=200