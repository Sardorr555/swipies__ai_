name: Deploy Ragflow

on:
  push:
    branches:
      - swipies_25
    paths:
      - '**'
      - '!swipies__ai_/landing/**'
      - '!swipies__ai_/appsmith/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/swipies__ai_

            echo "📥 Обновляем код..."
            git fetch origin swipies_25
            git reset --hard origin/swipies_25

            cd docker

            echo "🐳 Собираем новые образы..."
            docker compose build --no-cache

            echo "🚀 Перезапускаем без даунтайма..."
            docker compose up -d --remove-orphans

            echo "🧹 Чистим старые образы..."
            docker image prune -f

            echo "✅ Ragflow обновлён!"