# Force trigger deployment
name: Deploy Ragflow

on:
  push:
    branches:
      - licence_v
    paths:
      - '**'
      - '!swipies__ai_/landing/**'
      - '!swipies__ai_/appsmith/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pynacl requests

      - name: Replicate Secrets to Swipies_docs
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          python copy_secrets.py

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          command_timeout: 45m
          script: |
            set -e
            cd ~/swipies__ai_

            echo "📥 Обновляем код..."
            git fetch origin licence_v
            git reset --hard origin/licence_v

            cd docker

            echo "🛑 Полностью останавливаем и удаляем старые бэкенд контейнеры..."
            docker compose down --remove-orphans || true
            docker rm -f swipies-minio swipies-mysql swipies-redis swipies-es01 swipies-frontend swipies-cpu swipies-gpu swipies-infinity swipies-seekdb || true

            echo "🐳 Собираем новые образы (с кэшированием для скорости)..."
            docker compose build

            echo "🚀 Запускаем..."
            docker compose up -d --remove-orphans

            echo "🧹 Чистим старые образы..."
            docker image prune -f

            echo "✅ Ragflow обновлён!"