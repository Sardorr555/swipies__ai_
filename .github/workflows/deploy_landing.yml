name: Deploy Landing to AWS (Build on Server)

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  deploy-to-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy source to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          echo "📦 Copying source files to EC2..."
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "sudo mkdir -p ${EC2_TARGET_DIR} && sudo chown -R ${EC2_USER}:${EC2_USER} ${EC2_TARGET_DIR}"

          # удаляем старые файлы, кроме node_modules если есть
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "rm -rf ${EC2_TARGET_DIR}/*"

          # копируем весь код проекта (без node_modules)
          rsync -avz \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -o StrictHostKeyChecking=no" \
            "landing/" "${EC2_USER}@${EC2_HOST}:${EC2_TARGET_DIR}/"

      - name: Build on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          echo "🚀 Building landing page on EC2..."
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "
            cd ${EC2_TARGET_DIR} &&
            if ! command -v npm >/dev/null 2>&1; then
              echo 'Installing Node.js...'
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - &&
              sudo apt-get install -y nodejs
            fi &&
            npm install &&
            npm run build
          "

      - name: Reload Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "🔄 Reloading Nginx..."
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "sudo systemctl reload nginx"
