# Separate host and separate certificate. Never replaces the primary host.
server {
    listen 80;
    listen [::]:80;
    server_name knowledge.swipies.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/swipies-knowledge-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://knowledge.swipies.app$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name knowledge.swipies.app;
    ssl_certificate /etc/letsencrypt/live/swipies-knowledge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swipies-knowledge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/swipies-knowledge;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://swipies.app; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    location = /index.html { expires -1; }
    location ~* \.(woff2|css|js|svg)$ { expires 1d; }
}
