# Isolated new hostname. Existing swipies.app configuration is not changed.
server {
    listen 80;
    listen [::]:80;
    server_name sales.swipies.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/swipies-sales-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503 "Swipies Sales is being prepared.\n"; }
}
