version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=infini_rag_flow
      - DB_NAME=rag_flow
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - ragflow-network

  # Frontend (served by nginx)
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ragflow-network

  # MySQL Database (RAGFlow)
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=infini_rag_flow
      - MYSQL_DATABASE=rag_flow
    ports:
      - "5455:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    networks:
      - ragflow-network

volumes:
  mysql_data:

networks:
  ragflow-network:
    driver: bridge
